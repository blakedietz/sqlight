name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.15.0"
          rebar3-version: "3"
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - run: gleam format --check src test
      - run: gleam deps download

      # esqlite is pulled as a git dependency, so Gleam does not run its
      # rebar3 build (it only does that for Hex packages). Build the C NIF
      # by hand before the Erlang tests, otherwise esqlite3_nif.so is missing
      # and the NIF fails to load at runtime.
      - run: cd build/packages/esqlite && make compile

      - run: gleam test --target erlang
      - run: gleam test --target javascript
